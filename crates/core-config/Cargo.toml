[package]
name = "core-config"
description = "sing-box schema-compatible configuration model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Upstream protocols remain available; the explicit Rust X build omits them.
legacy-protocols = []
default = ["full", "legacy-protocols"]
rust-x = ["full"]
full = ["brotli", "regex"]

[dependencies]
base64.workspace = true
brotli = { workspace = true, optional = true }
flate2.workspace = true
# the reference compiles every `*_regex` matcher while it parses a rule
regex = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
